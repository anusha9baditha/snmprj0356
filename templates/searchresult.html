<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search - NoteX</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        body {
            background-color: #f7f8fa;
        }

        .navbar {
            background-color: #17212b;
        }

        .notex-logo {
            width: 42px;
            height: 42px;
            background-color: #feedca;
            color: #17212b;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .brand-name {
            font-size: 25px;
            font-weight: 700;
            color: white;
        }

        .notes-container {
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .notes-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .notes-header {
            background-color: #17212b;
            color: white;
        }

        .table th {
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .action-btn {
            min-width: 75px;
        }

        .btn-view {
            background-color: #17212b;
            color: white;
        }

        .btn-view:hover {
            background-color: #2c3e50;
            color: white;
        }

        .btn-update {
            background-color: #feedca;
            color: #17212b;
        }

        .btn-update:hover {
            background-color: #e8d2a8;
            color: #17212b;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background-color: #bb2d3b;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <div class="notex-logo">N</div>
                <span class="brand-name">NoteX</span>
            </a>

            <div class="ms-auto">
                <a href="home.html" class="btn btn-outline-light">
                    <i class="fa-solid fa-house me-2"></i>
                    Home
                </a>
            </div>

        </div>
    </nav>


    <!-- All Notes -->
    <div class="container notes-container">

        <div class="notes-card">

            <!-- Header -->
            <div class="notes-header p-4">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                    <div>
                        <h2 class="mb-1">
                            <i class="fa-solid fa-note-sticky me-2"></i>
                            All Notes
                        </h2>

                        <p class="mb-0 text-light">
                            Manage all your saved notes
                        </p>
                    </div>

                    <a href="add_notes.html" class="btn btn-light">
                        <i class="fa-solid fa-plus me-2"></i>
                        Add New Note
                    </a>

                </div>

            </div>

            {% if search_result %}
            <!-- Table -->
            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-light">

                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Title</th>
                            <th scope="col">Created At</th>
                            <th scope="col" class="text-center">Actions</th>
                        </tr>

                    </thead>

                    <tbody>
                        
                        {% for i in search_result %}
                        <!-- Note 1 -->
                        <tr>

                            <td>{{i[0]}}</td>

                            <td>
                                <i class="fa-solid fa-file-lines me-2"></i>
                               {{i[1]}}
                            </td>

                            <td>{{i[2]}}</td>

                            <td class="text-center">

                                <a href="{{url_for('viewnotes',notesid=i[0])}}" class="btn btn-sm btn-view action-btn me-1">
                                    <i class="fa-solid fa-eye me-1"></i>
                                    View
                                </a>

                                <a href="{{url_for('updatenotes',notesid=i[0])}}" class="btn btn-sm btn-update action-btn me-1">
                                    <i class="fa-solid fa-pen me-1"></i>
                                    Update
                                </a>
                                <a href="{{url_for('deletenotes',notesid=i[0])}}" class="btn btn-sm btn-update action-btn me-1">
                                    <i class="fa-solid fa-trash me-1"></i>
                                    Delete
                               </a>

                            </td>

                        </tr>
                        {% endfor %}
                        

                       

                    </tbody>

                </table>
                {% else %}
                        <p>No Search Data</p>
                        {% endif%}

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
