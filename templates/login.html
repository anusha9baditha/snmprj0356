<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoteX - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form-section {
            max-width: 450px;
        }

        .brand {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #6c757d;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
            padding-left: 15px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .login-btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
        }

        .image-section {
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, 0.75),
                    rgba(0, 0, 0, 0.05));
        }

        .image-content {
            position: absolute;
            bottom: 55px;
            left: 55px;
            right: 55px;
            color: white;
        }

        @media (max-width: 767px) {

            .image-section {
                display: none;
            }

            .form-section {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid p-0">

        <div class="row g-0 min-vh-100">

            <!-- LEFT SIDE - LOGIN -->
            <div class="col-md-6 d-flex justify-content-center align-items-center p-4">

                <div class="form-section w-100">

                    <!-- Logo / Brand -->
                    <div class="text-center mb-5">

                        <div class="brand">
                            NoteX
                        </div>

                        <p class="subtitle mt-2 mb-0">
                            Your notes. Your ideas. One place.
                        </p>

                    </div>


                    <!-- Login Heading -->
                    <div class="mb-4">

                        <h2 class="fw-bold">
                            Welcome back
                        </h2>

                        <p class="text-secondary">
                            Login to continue to your NoteX account.
                        </p>

                    </div>


                    <form action="" onsubmit="loginUser(event)">

                        <!-- Username -->
                        <div class="mb-3">

                            <label for="username" class="form-label fw-semibold" required>
                                Username
                            </label>

                            <input type="text" id="username" class="form-control" placeholder="Enter your username"
                                required>

                        </div>


                        <!-- Password -->
                        <div class="mb-2">

                            <label for="password" class="form-label fw-semibold" required>
                                Password
                            </label>

                            <input type="password" id="password" class="form-control" placeholder="Enter your password"
                                required>

                        </div>


                        <!-- Forgot Password -->
                        <div class="text-end mb-4">

                            <a href="#" class="text-decoration-none small">
                                Forgot password?
                            </a>

                        </div>


                        <!-- Login Button -->
                        <button type="submit" class="btn btn-dark w-100 login-btn">

                            Login

                        </button>

                    </form>


                    <!-- Register -->
                    <p class="text-center text-secondary mt-4">

                        Don't have an account?

                        <a href="register.html" class="text-primary text-decoration-none fw-semibold">

                            Create an account

                        </a>

                    </p>

                </div>

            </div>


            <!-- RIGHT SIDE - IMAGE -->
            <div class="col-md-6">

                <div class="image-section">

                    <img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1400&q=90"
                        alt="Workspace with notebook and laptop">

                    <div class="image-overlay"></div>

                    <div class="image-content">

                        <h2 class="fw-bold display-6">
                            Capture your ideas.
                        </h2>

                        <p class="fs-5 mt-3">
                            Keep your thoughts organized and
                            access your notes whenever inspiration strikes.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        function loginUser(event) {
            event.preventDefault();
            window.location.href = "home.html";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForGlyvwx9H09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

</body>

</html>
