<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Notes - NoteX</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        body {
            background-color: #f7f8fa;
        }

        .navbar {
            background-color: #17212b;
        }

        .notex-logo {
            width: 42px;
            height: 42px;
            background-color: #feedca;
            color: #17212b;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .brand-name {
            font-size: 25px;
            font-weight: 700;
            color: white;
        }

        .add-note-card {
            max-width: 750px;
            margin: 60px auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        textarea {
            min-height: 300px;
            resize: vertical;
        }

        .btn-submit {
            background-color: #17212b;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
        }

        .btn-submit:hover {
            background-color: #feedca;
            color: #17212b;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <div class="notex-logo">N</div>
                <span class="brand-name">NoteX</span>
            </a>

            <div class="ms-auto">
                <a href="home.html" class="btn btn-outline-light">
                    <i class="fa-solid fa-house me-2"></i>
                    Home
                </a>
            </div>

        </div>
    </nav>


    <!-- Add Notes Form -->
    <div class="container">

        <div class="add-note-card p-4 p-md-5">

            <div class="text-center mb-4">
                <i class="fa-solid fa-note-sticky fs-1 mb-3"></i>

                <h2 class="fw-bold">Add New Note</h2>

                <p class="text-secondary">
                    Create and save your notes easily with NoteX.
                </p>
            </div>

            <form action="#" method="post">

                <!-- Note Title -->
                <div class="mb-4">

                    <label for="noteTitle" class="form-label fw-semibold">
                        Note Title
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="noteTitle"
                        name="noteTitle"
                        placeholder="Enter your note title"
                        required>

                </div>


                <!-- Note Content -->
                <div class="mb-4">

                    <label for="noteContent" class="form-label fw-semibold">
                        Note Content
                    </label>

                    <textarea
                        class="form-control"
                        id="noteContent"
                        name="noteContent"
                        placeholder="Write your note here..."
                        required></textarea>

                </div>


                <!-- Submit Button -->
                <div class="text-center">

                    <button type="submit" class="btn btn-submit">
                        <i class="fa-solid fa-floppy-disk me-2"></i>
                        Save Note
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
